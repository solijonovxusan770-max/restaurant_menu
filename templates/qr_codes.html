<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stollar QR-kodlari</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #111;
            color: #d4af37;
            text-align: center;
            padding: 20px;
        }

        .qr-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            max-width: 800px;
            margin: 30px auto;
        }

        .qr-card {
            background: white;
            color: #111;
            padding: 20px;
            border-radius: 12px;
        }

        .qr-card img {
            width: 180px;
            max-width: 100%;
        }

        button {
            padding: 10px 18px;
            background: #d4af37;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        @media print {
            body {
                background: white;
                color: black;
            }

            button {
                display: none;
            }
        }
    </style>
</head>

<body>

    <h1>🍽 Restoran QR-kodlari</h1>
    <p>Har bir stol uchun alohida QR-kod</p>

    <button onclick="window.print()">🖨 Chop etish</button>

    <div class="qr-container">
        {% for table in tables %}
        <div class="qr-card">
            <h2>🪑 {{ table }}-stol</h2>
            <img src="{{ url_for('generate_qr', table_number=table) }}"
                 alt="{{ table }}-stol QR-kodi">
            <p>Buyurtma berish uchun skaner qiling</p>
        </div>
        {% endfor %}
    </div>

</body>
</html>
